kind = "web"
previewPath = "/"
title = "剑道馆会员系统"
version = "1.0.0"
id = "artifacts/kendo-dojo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21945

[services.development]
run = "pnpm --filter @workspace/kendo-dojo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kendo-dojo", "run", "build" ]
publicDir = "artifacts/kendo-dojo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21945"
BASE_PATH = "/"
